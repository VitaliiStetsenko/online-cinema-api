[project]
name = "online-cinema"
version = "1.0.0"
description = "Online Cinema Platform"
authors = [
    {name = "VitaliiStetsenko"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "celery (>=5.7.0,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "flower (>=2.2.0,<3.0.0)",
    "boto3 (>=1.43.125,<2.0.0)",
    "pydantic[email] (>=2.14.3,<3.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "bcrypt (<5)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "pillow (>=13.0.0,<14.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short", "--asyncio-mode=auto"]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# Models currently use SQLAlchemy's legacy Column(...) declarations. Migrate to
# SQLAlchemy 2.0 Mapped[...] annotations before enabling these checks.
disable_error_code = [
    "arg-type",
    "assignment",
    "call-arg",
    "no-any-return",
    "return-value",
    "union-attr",
    "var-annotated"
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
